<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eko — EkoKintsugi Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#17130F;
    --surface:#241C15;
    --surface-raised:#2E2419;
    --hairline:#3A2E20;
    --gold:#C89B4C;
    --gold-bright:#E9C87E;
    --forest:#4C6B51;
    --parchment:#EEE4CB;
    --muted:#A99B7D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(200,155,76,0.08), transparent 55%),
      radial-gradient(ellipse at 100% 110%, rgba(76,107,81,0.10), transparent 50%),
      var(--void);
    font-family:'Work Sans', sans-serif;
    color:var(--parchment);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  .app{
    width:100%;
    max-width:460px;
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:22px 22px 18px 18px;
    overflow:hidden;
    box-shadow:0 30px 60px -25px rgba(0,0,0,0.7);
    display:flex;
    flex-direction:column;
    height:min(720px, 92vh);
  }

  /* header */
  .head{
    padding:22px 24px 16px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .mark{width:34px;height:46px;flex-shrink:0;}
  .head h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
    letter-spacing:0.01em;
    margin:0;
    color:var(--gold-bright);
  }
  .head p{
    margin:2px 0 0;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.03em;
  }

  .seam{width:100%;height:14px;display:block;}
  .seam path{
    fill:none;
    stroke:var(--gold);
    stroke-width:1.4;
    stroke-linecap:round;
    stroke-dasharray:520;
    stroke-dashoffset:520;
    animation:draw 1.4s ease-out 0.2s forwards;
  }
  @keyframes draw{to{stroke-dashoffset:0;}}

  /* messages */
  .messages{
    flex:1;
    overflow-y:auto;
    padding:18px 20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .messages::-webkit-scrollbar{width:6px;}
  .messages::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:4px;}

  .row{display:flex;}
  .row.bot{justify-content:flex-start;}
  .row.user{justify-content:flex-end;}

  .bubble{
    max-width:82%;
    padding:11px 15px;
    font-size:14.5px;
    line-height:1.5;
  }
  .row.bot .bubble{
    background:var(--surface-raised);
    border-left:2px solid var(--gold);
    border-radius:4px 14px 14px 14px;
    color:var(--parchment);
  }
  .row.user .bubble{
    background:#332818;
    border-radius:14px 4px 14px 14px;
    color:var(--parchment);
  }

  .typing{display:flex;gap:4px;padding:4px 2px;}
  .typing span{
    width:5px;height:5px;border-radius:50%;
    background:var(--gold);
    opacity:0.4;
    animation:blink 1.1s infinite;
  }
  .typing span:nth-child(2){animation-delay:0.15s;}
  .typing span:nth-child(3){animation-delay:0.3s;}
  @keyframes blink{0%,80%,100%{opacity:0.25;}40%{opacity:0.9;}}

  /* chips */
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:0 20px 14px;
  }
  .chip{
    font-family:'Work Sans', sans-serif;
    font-size:12px;
    color:var(--gold-bright);
    background:transparent;
    border:1px solid var(--hairline);
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .chip:hover{border-color:var(--gold);color:var(--gold-bright);}

  /* input */
  .inputbar{
    display:flex;
    gap:10px;
    padding:14px 16px;
    border-top:1px solid var(--hairline);
    background:var(--surface);
  }
  .inputbar input{
    flex:1;
    background:var(--surface-raised);
    border:1px solid var(--hairline);
    border-radius:20px;
    padding:11px 16px;
    color:var(--parchment);
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    outline:none;
  }
  .inputbar input:focus{border-color:var(--gold);}
  .inputbar input::placeholder{color:var(--muted);}
  .send{
    width:40px;height:40px;
    border-radius:50%;
    border:none;
    background:var(--gold);
    color:var(--void);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s;
  }
  .send:hover{background:var(--gold-bright);}
  .send svg{width:16px;height:16px;}

  .footer-note{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    padding:0 16px 14px;
    letter-spacing:0.02em;
  }
  .footer-note b{color:var(--forest);font-weight:600;}
</style>
</head>
<body>

<div class="app">
  <div class="head">
    <svg class="mark" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
      <path d="M50,10 C80,30 90,55 90,75 C90,100 70,120 50,130 C30,120 10,100 10,75 C10,55 20,30 50,10 Z" fill="#3F5D45"/>
      <path d="M50,15 L46,40 L54,55 L44,75 L52,95 L48,115 L50,128 M54,55 L72,65 M44,75 L25,85" fill="none" stroke="#C89B4C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <h1>Eko</h1>
      <p>EkoKintsugi assistant — circular leather, golden repair</p>
    </div>
  </div>

  <svg class="seam" viewBox="0 0 400 20" preserveAspectRatio="none">
    <path d="M0,10 L40,6 L70,14 L110,4 L150,12 L190,7 L230,15 L270,5 L310,11 L350,6 L400,10"/>
  </svg>

  <div class="messages" id="messages"></div>

  <div class="chips" id="chips">
    <button class="chip" data-q="What is EkoKintsugi?">What is EkoKintsugi?</button>
    <button class="chip" data-q="What are your pieces made from?">What are pieces made from?</button>
    <button class="chip" data-q="How do you plant trees?">How do you plant trees?</button>
    <button class="chip" data-q="What is a digital product passport?">Digital product passport?</button>
  </div>

  <div class="inputbar">
    <input id="userInput" type="text" placeholder="Ask about our leather, trees, or passports…" autocomplete="off">
    <button class="send" id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="footer-note"><b>🌱 0</b> saplings tracked this chat</div>
</div>

<script>
const intents = [
  {
    id:'greeting',
    keywords:['hi','hello','hey','hii','helo','namaste','yo'],
    response:"Hello — welcome to EkoKintsugi. I'm here to talk about our circular leather goods and the reforestation behind every piece. Ask me about our materials, our digital product passports, or how we plant trees."
  },
  {
    id:'brand',
    keywords:['ekokintsugi','who are you','about','brand','story','philosophy','kintsugi','name mean','meaning'],
    response:"EkoKintsugi takes its name from the Japanese art of mending broken pottery with gold — turning damage into something more beautiful than before. We do the same with leather: premium offcuts that would otherwise go to waste are rescued and handcrafted into new luxury goods, each one carrying that philosophy of golden repair."
  },
  {
    id:'materials',
    keywords:['material','leather','offcut','off-cut','waste','fabric','made of','made from','sustainable'],
    response:"Every piece begins as premium leather offcuts and other sustainable materials — the surplus left over from larger production runs. Rather than letting that go to landfill, our artisans work it by hand into new luxury goods."
  },
  {
    id:'passport',
    keywords:['passport','trace','traceab','qr','origin','provenance','verify','authentic','history'],
    response:"Every item carries a digital product passport. Scan it, and you can trace the piece back through its materials and making — so nothing about where it came from is left to trust alone."
  },
  {
    id:'trees',
    keywords:['tree','plant','forest','reforest','carbon','sapling','environment','offset','positive','co2'],
    response:"For every single piece we make, we register a real sapling planted through reforestation. That's what makes us carbon-positive rather than just carbon-neutral — and like the leather itself, it's tracked and traceable."
  },
  {
    id:'craft',
    keywords:['handmade','handcraft','artisan','craftsmanship','quality','luxury','premium','durable'],
    response:"Each piece is handcrafted, not mass-produced — that's part of what lets us call this circular leather premium and luxury rather than merely 'recycled.' Sustainable doesn't mean compromised."
  },
  {
    id:'buy',
    keywords:['buy','purchase','shop','price','cost','order','where can i','store','collection','available'],
    response:"For the current collection, pricing, and ordering, the EkoKintsugi site itself is the best place to look — I don't have the live catalog in front of me. I'm happy to talk through the philosophy and materials behind the pieces in the meantime."
  },
  {
    id:'thanks',
    keywords:['thank','thanks','thank you','thx','appreciate'],
    response:"You're very welcome. Anything else you'd like to know about the leather, the passports, or the trees we plant?"
  },
  {
    id:'bye',
    keywords:['bye','goodbye','see you','later','exit'],
    response:"Thank you for stopping by EkoKintsugi. Every piece we make carries a little more forest with it — take care."
  }
];

const fallback = "I don't have an exact answer for that one — but I can speak to our circular leather, digital product passports, reforestation, and craftsmanship. What would you like to know?";

function matchIntent(text){
  const t = text.toLowerCase();
  let best = null, bestScore = 0;
  for(const intent of intents){
    let score = 0;
    for(const kw of intent.keywords){
      if(t.includes(kw)) score += kw.length; // longer/more specific matches weigh more
    }
    if(score > bestScore){ bestScore = score; best = intent; }
  }
  return best ? best.response : fallback;
}

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const chipsEl = document.getElementById('chips');
const footerNote = document.querySelector('.footer-note b');
let saplings = 0;

function addMessage(text, who){
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

function showTyping(){
  const row = document.createElement('div');
  row.className = 'row bot';
  row.id = 'typingRow';
  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping(){
  const row = document.getElementById('typingRow');
  if(row) row.remove();
}

function handleUserText(text){
  if(!text.trim()) return;
  addMessage(text, 'user');
  saplings += 1;
  footerNote.textContent = '🌱 ' + saplings;
  inputEl.value = '';
  showTyping();
  setTimeout(()=>{
    removeTyping();
    addMessage(matchIntent(text), 'bot');
  }, 550 + Math.random()*350);
}

sendBtn.addEventListener('click', ()=>handleUserText(inputEl.value));
inputEl.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') handleUserText(inputEl.value); });
chipsEl.addEventListener('click', (e)=>{
  const btn = e.target.closest('.chip');
  if(btn) handleUserText(btn.dataset.q);
});

// opening message
setTimeout(()=>{
  addMessage("Hello — I'm Eko, the EkoKintsugi assistant. Ask me about our circular leather, digital product passports, or the trees we plant for every piece.", 'bot');
}, 300);
</script>

</body>
</html>
